<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include "onlinecourse/_navbar.html" %}

<main class="container py-5" style="max-width:420px">
  <h1 class="h3 mb-4">Log in</h1>
  {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
  <form action="{% url 'onlinecourse:login' %}" method="POST">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" required autofocus>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Log in</button>
  </form>
  <p class="mt-3 small">No account? <a href="{% url 'onlinecourse:registration' %}">Register</a></p>
</main>
</body>
</html>
