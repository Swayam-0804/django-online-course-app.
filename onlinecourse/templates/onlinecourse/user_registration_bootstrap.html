<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include "onlinecourse/_navbar.html" %}

<main class="container py-5" style="max-width:420px">
  <h1 class="h3 mb-4">Create an account</h1>
  {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
  <form action="{% url 'onlinecourse:registration' %}" method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" required autofocus>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label for="first_name" class="form-label">First name</label>
        <input type="text" class="form-control" id="first_name" name="first_name">
      </div>
      <div class="col mb-3">
        <label for="last_name" class="form-label">Last name</label>
        <input type="text" class="form-control" id="last_name" name="last_name">
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Register</button>
  </form>
  <p class="mt-3 small">Already registered? <a href="{% url 'onlinecourse:login' %}">Log in</a></p>
</main>
</body>
</html>
